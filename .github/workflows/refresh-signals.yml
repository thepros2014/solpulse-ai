name: Refresh NMS Signals

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Run NMS Engine & Commit Signals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run NMS Engine
        run: node engine/runEngine.js
        env:
          NODE_ENV: production

      - name: Check for signal changes
        id: check_changes
        run: |
          git diff --quiet data/signals.json data/engine_meta.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push updated signals
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "SolPulse AI Bot"
          git config --global user.email "solpulse-bot@users.noreply.github.com"
          git add data/signals.json data/engine_meta.json
          git commit -m "chore(signals): auto-refresh NMS signals [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "Signals unchanged — no commit needed."
