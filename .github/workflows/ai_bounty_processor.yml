name: AI Bounty Processor

on:
  schedule:
    - cron: '0 */12 * * *' # Run every 12 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  evaluate-bounties:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          echo "Waiting for Ollama to start..."
          sleep 5

      - name: Download Llama 3.1 (High Quality)
        run: |
          # Pull the larger, much smarter 8B model. It will take longer to run, but provides vastly superior results.
          ollama pull llama3.1
          
      - name: Run AI Bounty Evaluation
        env:
          # We pass the secret API keys into the environment
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python process_with_ai.py
